name: Auto Scan Tenders

on:
  schedule:
    # Run every hour (at minute 0)
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        cd tenderwatch_app
        pip install -r requirements.txt
        
    - name: Initialize database if needed
      run: |
        cd tenderwatch_app
        if [ ! -f instance/tenderwatch.db ]; then
          python init_sources.py
        fi
        
    - name: Run tender scan
      run: |
        cd tenderwatch_app
        python -c "
from app import create_app
from app.scraper import run_scan

app = create_app()
with app.app_context():
    print('🔍 Starting automated scan...')
    results = run_scan()
    print(f'✅ Scan complete! Found {len(results)} new tenders')
        "
        
    - name: Upload database artifact
      uses: actions/upload-artifact@v4
      with:
        name: tenderwatch-db-${{ github.run_number }}
        path: tenderwatch_app/instance/tenderwatch.db
        retention-days: 7
        
    - name: Commit database changes
      run: |
        cd tenderwatch_app/instance
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "TenderWatch Bot"
        
        if [ -f tenderwatch.db ]; then
          git add tenderwatch.db
          git diff --staged --quiet || git commit -m "🤖 Auto-scan: Update tender database [$(date +'%Y-%m-%d %H:%M')]"
          git push
        fi
      continue-on-error: true
