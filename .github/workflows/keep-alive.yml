name: Keep App Alive

on:
  schedule:
    # Ping every 5 minutes during business hours (6 AM - 10 PM UTC)
    - cron: '*/5 6-22 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    
    steps:
    - name: Ping Streamlit App
      if: vars.STREAMLIT_URL != ''
      run: |
        echo "🏓 Pinging Streamlit app..."
        curl -I "${{ vars.STREAMLIT_URL }}" || echo "⚠️ Streamlit ping failed"
        
    - name: Ping Flask App
      if: vars.FLASK_URL != ''
      run: |
        echo "🏓 Pinging Flask app..."
        curl -I "${{ vars.FLASK_URL }}" || echo "⚠️ Flask ping failed"
        
    - name: Ping API Health Check
      if: vars.API_URL != ''
      run: |
        echo "🏓 Pinging API..."
        curl -f "${{ vars.API_URL }}/api/source-status" || echo "⚠️ API ping failed"
